packages:
  - packages/*
  - apps/*

catalog:
  "@hookform/resolvers": ^7.0.6
  "@tanstack/react-query": ^5.107.1
  "@tailwindcss/postcss": ^4.3.5
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/node": ^26
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  jsdom: ^31.0.1
  next: ^16.4.6
  oxfmt: ^0.78.0
  # oxlint-tsgolint 7.x is the TypeScript 7 line, required by oxlint 1.75.0+.
  oxlint: 1.93.0
  oxlint-tsgolint: ^7.0.2007
  react: ^19.3.1
  react-dom: ^19.3.1
  react-hook-form: ^7.92.0
  tailwindcss: ^4.3.5
  tsdown: ^0.23.7
  # TypeScript uses a tilde range on purpose: tsdown's dts generator (rolldown-plugin-dts) supports the native
  # TypeScript 7 compiler one minor line at a time (peer ~7.0.0 || ~7.1.0-0). Move to ~7.1 once 7.1 is stable.
  typescript: ~7.0.2
  vitest: ^5.1.0
  yup: ^1.7.1
  zod: ^4.6.7
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
