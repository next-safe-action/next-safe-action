packages:
  - packages/*
  - apps/*

catalog:
  "@hookform/resolvers": ^5.9.1
  "@tanstack/react-query": ^5.104.1
  "@tailwindcss/postcss": ^4
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  jsdom: ^30.1.2
  next: ^16.3.8
  oxfmt: ^0.72.0
  # oxlint-tsgolint 7.x is the TypeScript 7 line, required by oxlint 1.75.0+.
  oxlint: 1.87.0
  oxlint-tsgolint: ^7.0.2003
  react: ^19.3.0
  react-dom: ^19.3.0
  react-hook-form: ^7.89.0
  tailwindcss: ^4
  tsdown: ^0.23.0
  # TypeScript uses a tilde range on purpose: tsdown's dts generator (rolldown-plugin-dts) only uses the
  # native TypeScript 7 compiler for 7.0.x (peer ~7.0.0). Widen once it supports 7.1.
  typescript: ~7.0.2
  vitest: ^5.0.3
  yup: ^1.7.1
  zod: ^4.6.5
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
